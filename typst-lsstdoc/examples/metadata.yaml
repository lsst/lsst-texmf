abstract: >-
  This proof of concept demonstrates a Rubin Observatory technical document
  assembled from native Typst components and structured YAML metadata. It
  exercises the title page, authors and affiliations, document state, front
  matter, page furniture, technical content, cross-references, and an existing
  BibTeX workflow without attempting pixel-identical LaTeX output.
