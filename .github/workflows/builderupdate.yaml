name: Process Builder signup form

on:
  workflow_dispatch:
  schedule:
    #  UTC min hour day month dayOfWeek
    - cron: '53 6 * * *'

jobs:
  builder:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          python -m uv pip install --system -r requirements.txt

      - name: process builder form
        env:
          CLIENT: ${{ secrets.FORM_ACCESS_CLIENT }}
          TOKEN_PASSPHRASE: ${{ secrets.TOKEN_PASSPHRASE }}
        run: |
          echo "$CLIENT" >> client_secret.json
          ./bin/decrypt_secret.sh "$TOKEN_PASSPHRASE"
          make processbuilder
          # new_builders.yaml is a yaml list - only merge if it has entries
          if grep -q '^- ' new_builders.yaml; then
              echo "New builder entries:"
              cat new_builders.yaml
              make merge_builder
          else
              echo "No builder entries found - nothing to merge"
          fi

      - name: Check diff
        run: | #  set an environment variable
           if git diff --exit-code etc/builderlist.yaml; then
              echo "CHANGED=false" >> "${GITHUB_ENV}"
              echo "No changes - no PR"
           else
              echo "CHANGED=true" >> "${GITHUB_ENV}"
              echo "Git changes - should make PR"
           fi

      - name: Commit new builderlist.yaml
        if: env.CHANGED == 'true'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m " Builder list updates from google form " etc/builderlist.yaml buildersignup.skip

      # PR should be approved by RDO
      - name: Create Pull Request
        id: cpr
        if: env.CHANGED == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.WOM_UPDATEBIB_PAT }}
          branch: update-builderlist-from-form
          branch-suffix: short-commit-hash
          title: Automatic builder list update
          commit-message: builder list update from google form
          body: Update etc/builderlist.yaml from new entries in the builder signup google form
          reviewers: aalexov, ranpalgill, ellenweathers
